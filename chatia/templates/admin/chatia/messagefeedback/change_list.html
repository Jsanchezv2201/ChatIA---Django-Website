{% extends "admin/change_list.html" %}

{% block content %}
<div class="module" style="margin-bottom: 1rem;">
    <h2>Resumen de feedback</h2>
    <div class="results">
        <table>
            <tbody>
                <tr>
                    <th>Total de valoraciones</th>
                    <td>{{ feedback_stats.total }}</td>
                </tr>
                <tr>
                    <th>Útiles</th>
                    <td>{{ feedback_stats.useful }}</td>
                </tr>
                <tr>
                    <th>No útiles</th>
                    <td>{{ feedback_stats.not_useful }}</td>
                </tr>
                <tr>
                    <th>Porcentaje de útiles</th>
                    <td>{{ feedback_stats.useful_ratio }}%</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{{ block.super }}
{% endblock %}
