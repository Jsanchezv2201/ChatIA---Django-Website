<!-- Plantilla parcial renderizada por la vista `conversations_partial`.
    Este fragmento lo solicita HTMX y se inserta en la página principal.
    Mantener esta plantilla mínima porque se intercambiará en el DOM. -->
<div class="list-group">
    {% for conversation in conversations %}
    <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" href="{% url 'chatia:conversation_detail' conversation.id %}">
        <span>{{ conversation.title }}</span>
        <small class="note">{{ conversation.updated_at|date:'d/m/Y H:i' }}</small>
    </a>
    {% empty %}
    <div class="list-group-item">No tienes conversaciones todavía.</div>
    {% endfor %}
</div>
