{% extends 'chatia/base.html' %}

<!-- Página de listado de chats: aquí se busca, crea y actualiza la lista con HTMX. -->

{% block title %}Chats | ChatIA{% endblock %}

{% block content %}
<section class="auth-card card">
    <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between gap-2 align-items-center mb-3">
            <div>
                <h1 class="h3 mb-1">Chats</h1>
                <p class="note mb-0">Accede a tus chats guardados y abre el historial completo.</p>
            </div>
            <form method="post" action="{% url 'chatia:conversation_create' %}">
                {% csrf_token %}
                <button class="btn btn-primary" type="submit">Nuevo chat</button>
            </form>
        </div>

        <form id="search-conversations" class="mb-3" hx-get="{% url 'chatia:conversations_partial' %}" hx-target="#conversations-list" hx-swap="innerHTML" hx-trigger="keyup changed delay:500ms, search">
            <input type="search" name="q" class="form-control" placeholder="Buscar chats por título o contenido..." aria-label="Buscar chats">
        </form>

        <div class="conversations-wrapper">
            <div id="conversations-list" hx-get="{% url 'chatia:conversations_partial' %}" hx-trigger="load, every 15s" hx-swap="innerHTML">
                {% include 'chatia/_conversations_list.html' %}
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block footer %}{% endblock %}
