{% extends 'chatia/base.html' %}

{% block title %}Chats | ChatIA{% endblock %}

{% block content %}
<section class="auth-card card">
    <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between gap-2 align-items-center mb-3">
            <div>
                <h1 class="h3 mb-1">Chats</h1>
                <p class="note mb-0">Accede a tus conversaciones guardadas y abre el historial completo.</p>
            </div>
            <form method="post" action="{% url 'chatia:conversation_create' %}">
                {% csrf_token %}
                <button class="btn btn-primary" type="submit">Nueva conversación</button>
            </form>
        </div>

        <!--
            Cargador de fragmento con HTMX:
            - hx-get: URL para obtener el fragmento HTML con la lista de conversaciones
            - hx-trigger: dispara la petición al cargar la página y cada 15 segundos
            - hx-swap: reemplaza el contenido interno de este contenedor con la respuesta
            Permite actualizar la lista sin recargar toda la página (mejora la experiencia de usuario).
        -->
        <div id="conversations-list" hx-get="{% url 'chatia:conversations_partial' %}" hx-trigger="load, every 15s" hx-swap="innerHTML">
            {% include 'chatia/_conversations_list.html' %}
        </div>
    </div>
</section>
{% endblock %}
