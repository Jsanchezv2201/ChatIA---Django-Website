{% extends 'chatia/base.html' %}

<!-- Página de inicio de sesión: reutiliza el estilo base y renderiza el formulario de autenticación. -->

{% block title %}Entrar | ChatIA{% endblock %}

{% block content %}
<section class="auth-card card">
    <!-- Formulario de autenticacion de Django -->
    <div class="card-body">
    <h1 class="h3">Iniciar sesión</h1>
    <form method="post">
        <!-- Token CSRF obligatorio en formularios POST -->
        {% csrf_token %}
        <!-- Renderizado automatico del formulario de login -->
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
    <!-- Enlace al registro público para no depender del admin site -->
    <p class="note mt-3">¿No tienes cuenta? <a href="{% url 'register' %}">Crear una cuenta</a></p>
    </div>
</section>
{% endblock %}
